<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flow Helper RU</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="top"><div class="logo">F</div><div><h1>Flow Helper RU</h1><p>Локальный помощник Google Flow</p></div></div>
    <div class="status"><span id="dot"></span><span id="state">Проверка…</span></div>
    <button id="toggle" type="button">Загрузка…</button>
    <button id="open" class="secondary" type="button">Открыть Google Flow</button>
    <p class="note">Для сетевого доступа может потребоваться VPN с выходом в поддерживаемую страну. Расширение не меняет страну аккаунта, подписку или серверные права Google.</p>
    <p class="foot">Работает только на flow.google.com · Данные не отправляются на сторонние серверы</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
